name: test the function

on:
  workflow_dispatch: # Cho phép chạy thủ công từ giao diện GitHub

jobs:
  run-and-log:
    runs-on: ubuntu-latest # Sử dụng phiên bản Ubuntu mới nhất

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Bước này cần thiết để truy cập các file trong repo nếu bạn có các script hỗ trợ

    - name: update pack
      run: |
        sudo apt update -y

    - name: cai dat sshx
      id: sshx_run # Đặt ID cho bước này để có thể tham chiếu output của nó
      run: |
        echo "Running SSHX installation and execution..."
        curl -sSf https://sshx.io/get | sh -s run &> sshx_log.txt
        echo "SSHX command finished. Log saved to sshx_log.txt"
      shell: bash # Đảm bảo sử dụng bash để có thể redirect output

    - name: save log
      uses: actions/upload-artifact@v4
      with:
        name: sshx-log
        path: sshx_log.txt
        retention-days: 7 # Giữ log trong 7 ngày

    - name: chuan bi file
      id: prepare_log
      run: |
        LOG_CONTENT=$(cat sshx_log.txt)
        # Giới hạn kích thước log để tránh vượt quá giới hạn của Discord (2000 ký tự cho một tin nhắn)
        # Hoặc chia nhỏ log nếu quá lớn. Ở đây, tôi sẽ cắt ngắn nó.
        if [ ${#LOG_CONTENT} -gt 1900 ]; then
          LOG_CONTENT="${LOG_CONTENT:0:1900}...\n(Log truncated. Full log available as artifact.)"
        fi
        # Tránh các ký tự đặc biệt có thể gây lỗi JSON.
        # Thay thế tất cả các dấu nháy kép bằng dấu nháy đơn, và các ký tự xuống dòng bằng \n
        CLEAN_LOG_CONTENT=$(echo "$LOG_CONTENT" | sed 's/"/''/g' | sed ':a;N;$!ba;s/\n/\\n/g')
        echo "log_payload=$CLEAN_LOG_CONTENT" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: send
      uses: actions/github-script@v7 # Sử dụng github-script để có thể dùng fetch API
      with:
        script: |
          const webhookUrl = process.env.DISCORD_WEBHOOK_URL;
          if (!webhookUrl) {
            console.log('Discord webhook URL is not set. Skipping sending log.');
            return;
          }

          const logContent = '${{ steps.prepare_log.outputs.log_payload }}';
          const payload = {
            username: "GitHub Actions Bot",
            avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            content: "SSHX Execution Log:",
            embeds: [
              {
                title: "SSHX Command Output",
                description: `\`\`\`\n${logContent}\n\`\`\``,
                color: 3447003, # Một màu xanh dương
                footer: {
                  text: "Generated by GitHub Actions"
                },
                timestamp: new Date().toISOString()
              }
            ]
          };

          try {
            const response = await fetch(webhookUrl, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(payload),
            });

            if (!response.ok) {
              console.error(`Error sending log to Discord: ${response.status} - ${response.statusText}`);
              const errorText = await response.text();
              console.error(`Response body: ${errorText}`);
              throw new Error(`Discord webhook failed with status ${response.status}`);
            } else {
              console.log('Log successfully sent to Discord!');
            }
          } catch (error) {
            console.error('Failed to send log to Discord:', error);
            core.setFailed(error.message); # Báo lỗi nếu gửi không thành công
          }
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }} # Đọc webhook URL từ GitHub Secrets
